<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ RikkeiMall</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; text-align: center;">

<h1 th:text="${msg}" style="color: #2980b9;"></h1>
<hr>

<div style="margin-top: 30px; padding: 20px; background-color: #f1f2f6; display: inline-block; border-radius: 8px;">
    <h3>Mô phỏng Mua hàng (Để tạo Cookie)</h3>
    <form th:action="@{/buy}" method="post">
        <input type="text" name="name" placeholder="Nhập tên của bạn..." required style="padding: 8px;">
        <button type="submit" style="padding: 8px 15px; background: #27ae60; color: white; border: none; cursor: pointer;">
            Mua Hàng
        </button>
    </form>
</div>

</body>
</html>
